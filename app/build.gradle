plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lyricpeak.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lyricpeak.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
        manifestPlaceholders = [appLabel: 'Lyric Peak']
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the build machine's debug key so the APK installs directly,
            // and (because the key is cached) so new versions install over old ones.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
