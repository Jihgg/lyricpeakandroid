name: Build Lyric Peak APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Several quick commits in a row: only the newest one needs to build.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Reuse the same signing key every build, so new versions install over old ones.
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lyricpeak-signing-key-v1

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk LyricPeak.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricPeak-apk
          path: LyricPeak.apk

      - name: Publish APKs on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LyricPeak.apk \
            --title "Lyric Peak (latest build)" \
            --notes "Spotify + YT Music. For Spotify turn on Settings > Playback > Device broadcast status. YT Music plays inside the app."
