name: Build Lyric Peak APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Several quick commits in a row: only the newest one needs to build.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build both editions
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStandardRelease assemblePlusRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/standard/release/app-standard-release.apk LyricPeak.apk
          cp app/build/outputs/apk/plus/release/app-plus-release.apk LyricPeak-Plus-YTMusic.apk

      - name: Keep the APKs as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricPeak-apks
          path: |
            LyricPeak.apk
            LyricPeak-Plus-YTMusic.apk

      - name: Publish APKs on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LyricPeak.apk LyricPeak-Plus-YTMusic.apk \
            --title "Lyric Peak (latest build)" \
            --notes "LyricPeak.apk: Spotify, installs with no special access (turn on Spotify > Settings > Playback > Device broadcast status). LyricPeak-Plus-YTMusic.apk: YT Music + Spotify + any player, needs notification access."
