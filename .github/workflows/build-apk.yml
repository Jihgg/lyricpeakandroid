name: Build Lyric Peak APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricPeak-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK on the Releases page (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LyricPeak.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LyricPeak.apk --title "Lyric Peak (latest build)" --notes "Download LyricPeak.apk on your phone and open it to install."
